name: Android Build (NiñoBiólogo)

# Este workflow NO ha sido ejecutado por el agente que generó este proyecto (el entorno de
# generación no tiene acceso a GitHub ni a Android SDK/red — ver docs/BUILD_REPORT.md). Queda
# preparado para que, cuando el usuario haga push a un repositorio de GitHub, se compile
# automáticamente un APK real de depuración, se ejecuten los tests unitarios y lint, y se publique
# el APK como artefacto descargable.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Compilar, probar y empaquetar APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: gradlew clean
        run: ./gradlew clean

      - name: gradlew testDebugUnitTest
        run: ./gradlew testDebugUnitTest

      - name: gradlew lintDebug
        run: ./gradlew lintDebug

      - name: gradlew assembleDebug
        run: ./gradlew assembleDebug

      - name: Calcular SHA-256 del APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            sha256sum "$APK_PATH" | tee apk-sha256.txt
          else
            echo "No se encontró el APK en $APK_PATH" >&2
            exit 1
          fi

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NinoBiologo-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt

      - name: Publicar reportes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
